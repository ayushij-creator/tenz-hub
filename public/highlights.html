<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Highlights | TenZ Fan Hub</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main>
  <div class="wrap page-head">
    <div class="eyebrow">Clips</div>
    <h1>Highlights</h1>
  </div>
  <section class="section" style="padding-top:2rem">
    <div class="wrap">
      <div class="chips" id="chips"></div>
      <div class="grid" id="vids"></div>
    </div>
  </section>
</main>
<script src="/js/shell.js"></script>
<script>
  // id = the part after v= in the YouTube link
  const CLIPS = [
    { id: 'lUccoow5DHs', title: 'Sentinels vs Fnatic: Masters Reykjavík 2021 grand final', tag: 'Tournaments' },
    { id: 'wpDdRR-BqdU', title: 'Sentinels vs Gen.G: Masters Madrid 2024 grand final', tag: 'Tournaments' },
    { id: 'FyJpaYb7DN8', title: 'The 3K vs Paper Rex, Madrid 2024', tag: 'Plays' },
    { id: 'qianGpMGVk4', title: 'The 1v1 clutch vs Paper Rex, Madrid 2024', tag: 'Plays' },
    { id: 'mlTiB02-A8U', title: 'Thank you', tag: 'Moments' }
  ];
  const tags = ['All', ...new Set(CLIPS.map(c => c.tag))];
  const chips = document.getElementById('chips');
  const vids = document.getElementById('vids');

  function render(tag) {
    vids.replaceChildren();
    CLIPS.filter(c => tag === 'All' || c.tag === tag).forEach(c => {
      const card = document.createElement('div'); card.className = 'card';
      const v = document.createElement('div'); v.className = 'video';
      v.tabIndex = 0;
      v.setAttribute('role', 'button');
      v.setAttribute('aria-label', 'Play: ' + c.title);
      v.innerHTML = '<span class="play">▶ PLAY</span>';
      const start = () => {
        v.removeAttribute('role'); v.removeAttribute('tabindex'); v.removeAttribute('aria-label');
        v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(c.id)}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen title="${c.title.replace(/"/g, '&quot;')}"></iframe>`;
      };
      v.addEventListener('click', start, { once: true });
      v.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); }
      }, { once: true });
      const h = document.createElement('h3'); h.textContent = c.title; h.style.marginTop = '.8rem';
      const t = document.createElement('span'); t.className = 'tag'; t.textContent = c.tag;
      card.append(v, h, t); vids.append(card);
    });
  }

  tags.forEach((t, i) => {
    const b = document.createElement('button'); b.className = 'chip' + (i ? '' : ' on'); b.textContent = t;
    b.addEventListener('click', () => {
      chips.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); render(t);
    });
    chips.append(b);
  });
  render('All');
</script>
</body>
</html>
